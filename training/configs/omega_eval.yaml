defaults:
  - data: standalone_multiview_train
  - _self_

exp_name: baseline_omega
img_size: 518
num_workers: 0
seed_value: 42
accum_steps: 1
patch_size: 16

limit_train_batches: null
limit_val_batches: null
# mode: 'train'
mode: 'val'

seed: 42

max_epochs: &max_epochs 15

data:
  pose_convention: w2c

logging:
  run_folder_name: ${now:%Y-%m-%d}_${now:%H-%M-%S}
  log_dir: logs/${exp_name}/${logging.run_folder_name}
  log_visuals: False
  log_freq: 5
  log_level_primary: DEBUG
  log_level_secondary: WARNING
  all_ranks: False
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  csv_writer:
    enabled: True
    path: ${logging.log_dir}/csv
    filename: "epoch_metrics.csv"

  scalar_keys_to_log:
    train:
      mode: auto # Set to auto to log metrics actually returned by eval_batch.
    val:
      mode: auto # Set to auto to log metrics actually returned by eval_batch.
      keys_to_log:
        - recon_abs_rel
        - recon_mae
        - abs_rel
        - abe
        - rot_error_mean_deg
        - trans_error_mean
        - trans_angle_error_mean_deg
        # - cam_recon_abs_rel
        # - cam_recon_sq_err
        # - depth_recon_abs_rel
        # - depth_recon_sq_err

postprocess:
  data_keys:
    extrinsics: 'camera_pose'
    intrinsics: "camera_intrinsics"
    depths: 'depth'
    world_points: 'pts3d'
    pts3d_cam: 'pts3d_cam'
    valid_mask: 'valid_mask'
    depth_conf: "depth_conf"
    cam_points_conf: "cam_points_conf"
    world_points_conf: "world_points_conf"
    global_from_cam: "global_from_cam"
    global_from_cam_detach_pose: "global_from_cam_detach_pose"
    cam_from_depth: "cam_from_depth"
    global_from_depth: "global_from_depth"
    aligned_global_from_cam: "aligned_global_from_cam"
    aligned_global_from_depth: "aligned_global_from_depth"
    aligned_world_points: "aligned_world_points"
    global_aligned_to_center: "global_aligned_to_center"
  train:
    to_extri: True
    align:
      to_first_cam: 
        enabled: True 
        points: True
      pr_align_cam:
        enabled: False
        points: False
      pred_center:
        enabled: &pts_align_to_center False
      center_world:
        enabled: &pts_center_world False
        align_pose: True
      pts_align_to_gt:
        enabled: &pts_align_to_gt False
        detach_transform: False
        conf_percentage: 80
        with_scale: False
        align_pose: True
        normalize_depth: False
        normalize_pose: False
      pts_align_to_gt_rot:
        enabled: &pts_align_to_gt_rot False
        conf_percentage: 80
        with_scale: True
        align_pose: True
      gt_align_to_pts:
        enabled: &gt_align_to_pts False
        conf_percentage: 80
        align_pose: True
        # normalize_depth: False
        # normalize_pose: False
      depth_align_to_gt:
        enabled: False
        mode: mean
        conf_percentage: 80
        pose: False
    normalize:
      gt_pts: True
      gt_depth:
        enabled: false
        mode: mean
      pose_translation:
        gt_enabled: False
        pred_enabled: False
        eps: 1.0e-6
      gt_pts_invariant:
        enabled: False
      pr_pts:
        enabled: False
        metric: False
      pr_pts_invariant: 
        enabled: False
        translate: False
    transform:
      cam_from_depth: &cam_from_depth False
      global_from_cam: &global_from_cam False
      global_from_cam_detach_pose: &global_from_cam_detach_pose False
      global_from_depth: &global_from_depth False
  val:
    to_extri: True
    align:
      to_first_cam: 
        enabled: True
        points: True
      pr_align_cam:
        enabled: True
        points: False
      pts_align_to_gt:
        enabled: True
        conf_percentage: null
        with_scale: True
        align_pose: False
        normalize_depth: False
        normalize_pose: False
      depth_align_to_gt:
        enabled: True
        conf_percentage: null
        pose: True
    normalize:
      gt_pts: False
      pr_pts:
        enabled: False
        metric: False
    metrics:
      camera:
        enabled: True
        abs_err: True
        rel_err: false
        auc: false
        pts3d_pose:
          enabled: true
          normalize_translation: true
          failure_mode: identity
          confidence: {mode: threshold, threshold: 1.0, percentile: 85.0}
          pnp: {iterations: 100, reprojection_error: 5.0, focal_candidates: 100, focal_min_factor: 0.5, focal_max_factor: 3.0}
        # abs_err_angle: True
        # rel_err_angle: True
        # all_pairs_err: True
      depth:
        enabled: True
      intrinsics:
        enabled: true
      recon:
        pts_err: True
        nn_metrics: false
        nn_threshold: 0.05
        nn_max_points: 200000
        from_cam_err: False
        from_depth_err: False
    transform:
      cam_from_depth: *cam_from_depth
      global_from_cam: *global_from_cam
      global_from_cam_detach_pose: *global_from_cam_detach_pose
      global_from_depth: *global_from_depth

    
checkpoint:
  save_dir: logs/${exp_name}/${logging.run_folder_name}/ckpts
  save_freq: *max_epochs
  best_monitor: val_hypersim_recon_abs_rel
  best_mode: min
  best_full: true
  # resume_checkpoint_path: /lc/code/3D/vggt-training/training/logs/exp001/2025-10-24_23-14-55/ckpts/checkpoint.pt
  resume_checkpoint_path: /home/liucong/codes/pretrained/omega/vggt_omega_1b_512.pt
  # /lc/code/pretrained/vggt/weights/model.pt
  resume_config_skip_keys: [break_at]
  resume_optimizer: true
  lazy_resume_optimizer: true
  strict: true
  filter_keys:
    enabled: false
    heads_to_keep: null
    heads_to_discard: null
    # default_keep: False
    default_keep: True


loss:
  _target_: train_utils.loss.MultitaskLoss
  camera: 
    weight: 5.0
    weight_focal: 0.5
    weight_trans: 1.0
    weight_rot: 1.0
    loss_type: "l1" # The paper uses smooth l1 loss, but we found l1 loss is more stable than smooth l1 and l2 loss.  
  angle_pose: 
    weight: 1.0
    weight_trans: 1.0
    weight_rot: 1.0
    relative_weight: 0.5
    absolute_weight: 0.5
    compute_relative: False
    compute_absolute: False
    loss_type: "l1" # The paper uses smooth l1 loss, but we found l1 loss is more stable than smooth l1 and l2 loss.  
  depth:
    weight: 1.0
    gradient_loss_fn: "grad" 
    valid_range: 0.98
    reg_loss_type: "smooth_l1"
    scale_invariant: false
    # scale_invariant_mode: "scale"
    conf_weight: 0.
    reg_weight: 0.
    gamma: 10.0
    alpha: 0.2
    grad_weight: 1.0
    silog_weight: 1.0
    silog_variance_focus: 0.85
    silog_conf_weight: 1.0
  # point: null
  # If you want to enable point, use the following config
  point: 
    weight: 1.0
    global_aligned_weight: 0.1
    global_from_cam_weight: 0.05
    global_from_depth_weight: 0.05
    cam_from_depth_weight: 0.05
    gradient_loss_fn: "normal" 
    valid_range: 0.98
    gamma: 30.0
    alpha: 0.2
    reg_loss_type: "smooth_l1"
    conf_weight: 1.0
    reg_weight: 1.0
    grad_weight: 1.0
    aligned_valid_range: 0.8
    conf_percentage: 90
  switch: null
    # pts_align_to_gt: *pts_align_to_gt
    # pts_align_to_gt_rot: *pts_align_to_gt_rot
    # gt_align_to_pts: *gt_align_to_pts
    # pts_align_to_center: *pts_align_to_center
    # pts_center_world: *pts_center_world
  regulize_scale:
    enabled: True
    scale_weight: 0.3
    translation_weight: 0
  vggt: True
  enabled: true
  track: null   


optim:
  val_freq: 1
  accumulation_mode: chunk_within_batch
  log_per_optimizer_step: true
  param_group_modifiers: False
  warmup_epochs: -1
  amp:
    enabled: True
    amp_dtype: bfloat16
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["aggregator.patch_embed"]
        max_norm: 1.0   
        norm_type: 2
      # - module_name: ["aggregator.asg"]
      #   max_norm: 5.0   
      #   norm_type: 2
      - module_name: ["aggregator"]
        max_norm: 5.0   
        norm_type: 2
      - module_name: ["dense_head"]
        max_norm: 5.0
        norm_type: 2
      - module_name: ["camera"]
        max_norm: 5.0   # feel free to reduce this if you see instabilities
        norm_type: 2
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 1e-4
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 1e-4
              end_value: 1e-8
          lengths: [0.05, 0.95]
          interval_scaling: ['rescaled', 'rescaled']
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.05


model:
  _target_: vggt_omega.models.vggt_omega.VGGTOmega
  conf_logit_max: null
  enable_camera: True
  simple_camera: false
  enable_depth: true
  enable_point: false
  enable_cam_point: false
  # VGGTOmega constructor defaults are intentionally left in the model code.
  # Override only the values needed for an experiment, e.g.:
  patch_embed: null
  patch_size: 16
  embed_dim: 1024
  depth: 24
  num_global_register_tokens: 0
  num_register_tokens: 16
  # cached_layer_indices: [2, 5, 8, 11]
  # register_attention_block_indices: [2, 4, 7, 10]
  dpt_frames_chunk_size: 8
  asg: false
  asg_max_hw: 512
  loop: false
  grad_start_layer: 0
  grad_end_layer: -1
  register_attention_block_indices: [2, 6, 9, 14, 20]
  cached_layer_indices: [4, 11, 17, 23]
  rope_freq: 100
  first_cam: true


distributed:
  # check https://docs.pytorch.org/docs/stable/generated/torch.nn.parallel.DistributedDataParallel.html for options
  backend: nccl
  comms_dtype: None
  find_unused_parameters: false
  timeout_mins: 30
  gradient_as_bucket_view: true  # Less memory used
  bucket_cap_mb: 25
  broadcast_buffers: true

cuda:
  cudnn_deterministic: false
  cudnn_benchmark: true
  allow_tf32: true
