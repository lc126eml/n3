defaults:
  - data: standalone_multiview_train

gpu_lock_priority: 10

exp_name: test
seed_value: 42
accum_steps: 2

limit_train_batches: null
limit_val_batches: null
mode: 'train'
test: False
# mode: 'val'

seed: 42

max_epochs: &max_epochs 130
break_at: 15
lr_scheduler_lengths: &lr_scheduler_lengths [0.05, 0.95] #15
# lr_scheduler_lengths: &lr_scheduler_lengths [0.0075, 0.9925] #100
# lr_scheduler_lengths: &lr_scheduler_lengths [0.075, 0.925] #10
compile:
  enabled: false
  mode: "reduce-overhead"
  fullgraph: false
  dynamic: true

env_variables:
  LOSS_CHECKS_ENABLED: "0"

logging:
  run_folder_name: ${now:%Y-%m-%d}_${now:%H-%M-%S}
  log_dir: logs/${exp_name}/${logging.run_folder_name}
  log_visuals: False
  log_freq: 50
  log_level_primary: DEBUG
  log_level_secondary: WARNING
  all_ranks: False
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  csv_writer:
    enabled: True
    path: ${logging.log_dir}/csv
    filename: "epoch_metrics.csv"

  scalar_keys_to_log:
    train:
      mode: explicit # Set to auto to log scalar values actually returned by the loss.
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_Rel_T
        - loss_Rel_R
        - loss_Pose_T
        - loss_Pose_R
        - loss_FL
        # - aux_loss
        # - loss_conf_depth
        - loss_conf_point
        # - loss_reg_depth
        # - loss_grad_depth
        # - loss_silog_depth
        # - loss_silog_conf_depth
        - loss_reg_point
        # - loss_scale
        # - loss_trans
        # - pts3d_cam_loss_reg_point
        # - global_from_cam_loss_reg_point
        # - cam_from_depth_loss_reg_point
        # - global_from_depth_loss_reg_point
    val:
      mode: explicit # Set to auto to log metrics actually returned by eval_batch.
      keys_to_log:
        - recon_abs_rel
        - recon_mae
        # - abs_rel
        # - abe
        - rot_error_mean_deg
        - trans_error_mean
        - trans_angle_error_mean_deg
        # - cam_recon_abs_rel
        # - cam_recon_sq_err
        # - depth_recon_abs_rel
        # - depth_recon_sq_err

postprocess:
  data_keys:
    extrinsics: 'camera_pose'
    intrinsics: "camera_intrinsics"
    depths: 'depth'
    world_points: 'pts3d'
    pts3d_cam: 'pts3d_cam'
    valid_mask: 'valid_mask'
    depth_conf: "depth_conf"
    cam_points_conf: "cam_points_conf"
    world_points_conf: "world_points_conf"
    global_from_cam: "global_from_cam"
    global_from_cam_detach_pose: "global_from_cam_detach_pose"
    cam_from_depth: "cam_from_depth"
    global_from_depth: "global_from_depth"
    aligned_global_from_cam: "aligned_global_from_cam"
    aligned_global_from_depth: "aligned_global_from_depth"
    aligned_world_points: "aligned_world_points"
  train:
    to_extri: True
    align:
      to_first_cam: 
        enabled: False 
        points: False
      pr_align_cam:
        enabled: False
        points: False
      pred_center:
        pr_to_gt: &pts_align_to_center False
        enabled: False
        align_pose: True
      center_world:
        enabled: &pts_center_world False
        align_pose: True
      pts_align_to_gt:
        enabled: &pts_align_to_gt False
        detach_transform: False
        conf_percentage: 80
        with_scale: True
        align_pose: True
        normalize_depth: False
        normalize_pose: False
      pts_align_to_gt_rot:
        enabled: &pts_align_to_gt_rot False
        conf_percentage: 80
        with_scale: True
        align_pose: True
      gt_align_to_pts:
        enabled: &gt_align_to_pts False
        conf_percentage: 80
        align_pose: True
        # normalize_depth: False
        # normalize_pose: False
      depth_align_to_gt:
        enabled: False
        conf_percentage: 80
        pose: False
    normalize:
      gt_pts: False
      gt_depth: False
      gt_pts_invariant: 
        enabled: True
        translate: True
        min_scale: null
        max_scale: null
        min_valid_points: 3
      pr_pts:
        enabled: False
        metric: False
      pr_pts_invariant: 
        enabled: False
        translate: False
        min_scale: 0.5
        max_scale: 3.0
        min_valid_points: 3
    transform:
      cam_from_depth: &cam_from_depth False
      global_from_cam: &global_from_cam False
      global_from_cam_detach_pose: &global_from_cam_detach_pose False
      global_from_depth: &global_from_depth False
  val:
    to_extri: True
    align:
      to_first_cam: 
        enabled: True
        points: False
      pr_align_cam:
        enabled: True
        points: False
      pts_align_to_gt:
        enabled: True
        conf_percentage: 80
        with_scale: True
        align_pose: False
        normalize_depth: False
        normalize_pose: False
      depth_align_to_gt:
        enabled: false
        conf_percentage: 80
        pose: True
    normalize:
      gt_pts: False
      pr_pts:
        enabled: False
        metric: False
    metrics:
      camera:
        enabled: True
        abs_err: True
        rel_err: false
        auc: false
        # abs_err_angle: True
        # rel_err_angle: True
        # all_pairs_err: True
      depth:
        enabled: false
        align: median
        sq_rel: false
        rmse: false
        log_rmse: false
        delta: false
      intrinsics:
        enabled: true
      recon:
        pts_err: True
        nn_metrics: false
        nn_threshold: 0.05
        nn_max_points: 200000
        from_cam_err: False
        from_depth_err: False
    transform:
      cam_from_depth: *cam_from_depth
      global_from_cam: *global_from_cam
      global_from_cam_detach_pose: *global_from_cam_detach_pose
      global_from_depth: *global_from_depth

    
checkpoint:
  save_dir: logs/${exp_name}/${logging.run_folder_name}/ckpts
  save_freq: 5 #*max_epochs
  best_monitor: val_hypersim_recon_abs_rel
  best_mode: min
  best_full: false
  resume_checkpoint_path: null
  resume_config_skip_keys: [break_at]
  resume_optimizer: true
  lazy_resume_optimizer: true
  # resume_checkpoint_path: /lc/code/3D/vggt-training/training/logs/exp001/2025-10-24_23-14-55/ckpts/checkpoint.pt
  # resume_checkpoint_path: /lc/code/pretrained/vggt/weights/model.pt
  # strict: False
  # filter_keys:
  #   enabled: True
  #   heads_to_keep: 
  #     - ['aggregator.patch_embed.', 'aggregator.patch_embed.']
  #   heads_to_discard:
  #     - 'track_head'
  #   default_keep: False
    # default_keep: True
  # resume_checkpoint_path: /lc/code/pretrained/dinov2/dinov2_vitl14_reg4_pretrain.pth
  strict: False
  filter_keys:
    enabled: True
    heads_to_keep: 
      - ['layer', 'aggregator.patch_embed.blocks']
      # - ['*', 'aggregator.patch_embed.']
    heads_to_discard: null
    default_keep: False
    # default_keep: True


loss:
  _target_: train_utils.loss.MultitaskLoss
  camera:
    weight: 5.0
    weight_focal: 0.5
    weight_trans: 1.0
    weight_rot: 1.0
    pose_encoding_type: &pose_encoding_type absT_quaR_FoV #absT_quaR_logK
    loss_type: "l1"   
    beta: 1.0
  angle_pose: 
    weight: 1.0
    weight_trans: 1.0
    weight_rot: 1.0
    relative_weight: 0.5
    absolute_weight: 0.5
    compute_relative: true
    compute_absolute: true
    relative_neighbors: 1
    loss_type: "l1" 
    beta: 1.0
  depth:
    weight: 1.0
    gradient_loss_fn: "grad" #"grad" ""
    valid_range: 0.98
    reg_loss_type: "l2"
    reg_loss_beta: 1.0
    scale_invariant: false
    scale_invariant_mode: "scale"
    log_depth: false
    conf_weight: 1.0
    gamma: 1.0
    alpha: 0.2
    reg_weight: 1.0
    grad_weight: 1.0
    silog_weight: 0.0
    silog_variance_focus: 0.85
    silog_conf_weight: 0.0
  # point: null
  # If you want to enable point, use the following config
  point: 
    weight: 1.0
    global_aligned_weight: 1.0
    global_from_cam_weight: 1.0
    global_from_depth_weight: 1.0
    cam_from_depth_weight: 1.0
    pts3d_cam_weight: 0.05
    gradient_loss_fn: "normal" #"normal" ""
    valid_range: 0.98
    gamma: 1.0
    alpha: 0.2
    reg_loss_type: "l2"
    reg_loss_beta: 1.0
    conf_weight: 1.0
    reg_weight: 1.0
    grad_weight: 1.0
    aligned_valid_range: 0.8
    conf_percentage: 90
  switch:
    aligned_world_points: ${and:${pts_center_world}, ${and:${pts_align_to_center}, ${and:${pts_align_to_gt}, ${pts_align_to_gt_rot}}}}
  regulize_scale:
    enabled: false
    scale_weight: 0.3
    translation_weight: 0
  vggt: false
  asg_weight: 30
  enabled: true
  track:


optim:
  val_freq: 1
  accumulation_mode: chunk_within_batch
  log_per_optimizer_step: true
  param_group_modifiers: False
  warmup_epochs: &warmup_epochs 15
  warmup_batch_cost_discount: 0.5
  warmup_epoch2: &warmup_epoch2 1
  warmup_epoch3: &warmup_epoch3 2
  warmup_configs: [] 
    # - attr: "loss.angle_pose.relative_weight"
    #   value: 0.7
    #   epoch: *warmup_epochs
    # - attr: "loss.regulize_scale.scale_weight"
    #   value: 1.0
    #   epoch: *warmup_epoch2
    # - attr: "loss.regulize_scale.translation_weight"
    #   value: 0.5
    #   epoch: *warmup_epoch3
    # - attr: "loss.angle_pose.compute_absolute"
    #   value: true
    #   epoch: *warmup_epoch2
    # - attr: "loss.angle_pose.compute_relative"
    #   value: true
    #   epoch: *warmup_epoch2
    # - attr: "loss.camera.weight"
    #   value: 5.0
    #   epoch: *warmup_epochs
    # - attr: "loss.camera.weight_focal"
    #   value: 0.5
    #   epoch: *warmup_epoch2
    # - attr: "loss.camera.weight_trans"
    #   value: 1.0
    #   epoch: *warmup_epoch2
    # - attr: "loss.camera.weight_rot"
    #   value: 1.0
    #   epoch: *warmup_epoch2
    # - attr: "loss.depth.gradient_loss_fn"
    #   value: "grad"
    #   epoch: *warmup_epoch3
    # - attr: "loss.point.gradient_loss_fn"
    #   value: "normal"
    #   epoch: *warmup_epoch3
    # - attr: "loss.point.global_aligned_weight"
    #   value: 1.0
    #   epoch: *warmup_epoch3
    # - attr: "loss.point.valid_range"
    #   value: 0.98
    #   epoch: *warmup_epochs

  optimizer:
    _target_: torch.optim.AdamW
    weight_decay: 0.05

  frozen_module_names:
      # - "*aggregator*"  # example, freeze the aggregator
      - "*patch_embed*"
  lr_multipliers:
    - name: patch_embed
      ratio: 1.0e-2
      param_names:
        - "aggregator.patch_embed.*"
    # - name: frame_blocks
    #   ratio: 1.0e-1
    #   param_names:
    #     - "aggregator.frame_blocks.*"
    #     - "aggregator.inter_frame_blocks.*"
    #     - "aggregator.camera_token.*"
    #     - "aggregator.register_token.*"
    # - name: asg
    #   ratio: 0.01
    #   param_names:
    #     - "aggregator.asg.*"
    - name: camera_head
      ratio: 0.01
      param_names:
        - "camera_head.*"
    - name: dense_head
      ratio: 0.1
      param_names:
        - "dense_head.*"


  amp:
    enabled: True
    amp_dtype: bfloat16
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["aggregator.patch_embed"]
        max_norm: 1.0   
        norm_type: 2
      # - module_name: ["aggregator.asg"]
      #   max_norm: 5.0   
      #   norm_type: 2
      - module_name: ["aggregator"]
        max_norm: 5.0   
        norm_type: 2
      - module_name: ["dense_head"]
        max_norm: 5.0
        norm_type: 2
      - module_name: ["camera"]
        max_norm: 5.0   # feel free to reduce this if you see instabilities
        norm_type: 2
  options:
    lr:
    - scheduler:
        _target_: fvcore.common.param_scheduler.CompositeParamScheduler
        schedulers:
        - _target_: fvcore.common.param_scheduler.LinearParamScheduler
          start_value: 1e-6
          end_value: &lr_base 5e-4
        - _target_: fvcore.common.param_scheduler.CosineParamScheduler
          start_value: *lr_base
          end_value: 1e-6
        lengths: *lr_scheduler_lengths
        interval_scaling: ['rescaled', 'rescaled']
    weight_decay:
    - scheduler:
        _target_: fvcore.common.param_scheduler.ConstantParamScheduler
        value: 0.05


model:
  _target_: vggt_omega.models.vggt_omega.VGGTOmega
  conf_logit_max: null
  enable_camera: True
  simple_camera: false
  enable_depth: false
  enable_point: True
  enable_cam_point: False
  # VGGTOmega constructor defaults are intentionally left in the model code.
  # Override only the values needed for an experiment, e.g.:
  patch_embed: "/home/liucong/codes/pretrained/dinov3/vitb16"
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_global_register_tokens: 0
  num_register_tokens: 16
  cached_layer_indices: [2, 5, 8, 11]
  register_attention_block_indices: [2, 4, 6, 8, 10]
  dpt_frames_chunk_size: 8
  asg: false
  asg_max_hw: 512
  loop: false
  grad_start_layer: 0
  # register_attention_block_indices: [2, 6, 9, 14, 20]
  # cached_layer_indices: (4, 11, 17, 23)
  rope_freq: -1
  first_cam: false


distributed:
  # check https://docs.pytorch.org/docs/stable/generated/torch.nn.parallel.DistributedDataParallel.html for options
  backend: nccl
  comms_dtype: None
  find_unused_parameters: false
  timeout_mins: 30
  gradient_as_bucket_view: true  # Less memory used
  bucket_cap_mb: 25
  broadcast_buffers: true

cuda:
  cudnn_deterministic: false
  cudnn_benchmark: true
  allow_tf32: true
