# @package _global_
# Align predictions to GT (rigid alignment; no invariant normalization).
defaults:
  - /default_nodeep
  - _self_

gpu_lock_priority: 10

exp_name: pts_align_to_gt_loop

seed: 42
max_epochs: &max_epochs 130
break_at: 80
logging:
  log_freq: 100

# checkpoint:
#   resume_checkpoint_path: /home/liucong/codes/n3r/training/configs/logs/test/pts_align_to_gt_rcropP1.00_lr50_e130/2026-05-27_10-49-46/ckpts/checkpoint.pt
#   resume_config_skip_keys: [break_at, seed, data.data_module.train_config.batch_size]
data:
  data_module:
    train_config:
      batch_size: 40
      resolution_cost_power: 1.13
      augs:
        max_scale: 1.2
        random_crop_prob: 0.0
        pcrop: 0.0
postprocess:
  train:
    align:
      to_first_cam:
        enabled: False
      pred_center:
        enabled: False
      center_world:
        enabled: False
      pts_align_to_gt:
        enabled: &pts_align_to_gt True
        to_pred_pose: false
        conf_percentage: 80
        with_scale: True
        align_pose: True
        normalize_depth: False
        normalize_pose: False
      pts_align_to_gt_rot:
        enabled: False
      gt_align_to_pts:
        enabled: False
    normalize:
      gt_pts: false
      pr_pts:
        enabled: false
        metric: false
      gt_depth: false
      gt_pts_invariant:
        enabled: true
        translate: true
      pr_pts_invariant:
        enabled: true
        translate: true

loss:
  switch:
    pts_align_to_gt: *pts_align_to_gt
optim:
  val_freq: 1
  param_group_modifiers: False
  warmup_epochs: 30
  lr_multipliers:
    - name: patch_embed
      ratio: 1.0e-2
      param_names:
        - "aggregator.patch_embed.*"
    - name: asg
      ratio: 0.01
      param_names:
        - "aggregator.asg.*"
    - name: camera_head
      ratio: 0.1
      param_names:
        - "camera_head.*"
    - name: dense_head
      ratio: 0.1
      param_names:
        - "dense_head.*"
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["aggregator.patch_embed"]
        max_norm: 1.0   
        norm_type: 2
      - module_name: ["aggregator.asg"]
        max_norm: 1.0   
        norm_type: 2
      - module_name: ["aggregator"]
        max_norm: 5.0   
        norm_type: 2
      - module_name: ["dense_head"]
        max_norm: 5.0
        norm_type: 2
      - module_name: ["camera"]
        max_norm: 5.0   # feel free to reduce this if you see instabilities
        norm_type: 2


model:
  # rope_freq: 100
  # rope_freq: -1
  first_cam: false
  asg: false
  asg_max_hw: 512
  loop: true
  enable_depth: false