# @package _global_
# Align predictions to GT (rigid alignment; no invariant normalization).
defaults:
  - /default_nodeep
  - _self_

# exp_name: align_ablation_pts_align_to_gt

seed: 42
max_epochs: &max_epochs 130
break_at: 80
logging:
  log_freq: 50

checkpoint:
  resume_checkpoint_path: /home/liucong/codes/n3r/training/configs/logs/test/pts_align_to_gt_rcropP1.00_lr50_e130/2026-05-26_19-39-01/ckpts/checkpoint.pt
  resume_config_skip_keys: [break_at, seed, data.data_module.train_config.batch_size]
data:
  data_module:
    train_config:
      batch_size: 40
      resolution_cost_power: 1.13
postprocess:
  train:
    align:
      to_first_cam:
        enabled: False
      pred_center:
        enabled: False
      center_world:
        enabled: False
      pts_align_to_gt:
        enabled: &pts_align_to_gt True
        conf_percentage: 80
        with_scale: True
        align_pose: True
        normalize_depth: False
        normalize_pose: False
      pts_align_to_gt_rot:
        enabled: False
      gt_align_to_pts:
        enabled: False
    normalize:
      gt_pts: false
      pr_pts:
        enabled: false
        metric: false
      gt_depth: false
      gt_pts_invariant:
        enabled: true
        translate: true
      pr_pts_invariant:
        enabled: true
        translate: true

loss:
  switch:
    pts_align_to_gt: *pts_align_to_gt
