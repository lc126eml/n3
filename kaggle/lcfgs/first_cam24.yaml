id: 
config_name: default_kaggle_vggt
# desc: pred_center_pr2gt
# desc: pred_center_gt2pr
desc: first_cam_vggt_l24
# desc_keys: ["lr"]
run_id: 0
total_runs: 10
seed: 42
simple:
  - max_epochs: 130
  - break_at: 130
  - accum_steps: 4
  - checkpoint.resume_config_skip_keys: []
  - data.data_module.train_config.batch_size: 8
  - data.data_module.train_config.debug_enumerate_batches: false
  - optim.warmup_epochs: 20
  - optim.warmup_batch_cost_discount: 0.4
  - optim.gradient_clip.configs.0.max_norm: 5.0
  # - optim.gradient_clip.configs.1.max_norm: 1.0
  # - optim.gradient_clip.configs.2.max_norm: 1.0
  # - optim.gradient_clip.configs.3.max_norm: 1.0
  - optim.gradient_clip.configs.4.max_norm: 5.0
  - optim.val_freq: 1
  # - optim.frozen_module_names: null
  - optim.lr_multipliers.0.ratio: 0.01
  - optim.lr_multipliers.1.ratio: 0.01
  - optim.lr_multipliers.2.ratio: 0.01
  - model.enable_depth: false
  - model.patch_embed: "/kaggle/input/datasets/sinayliu/dino-ds/vitl16"
  - model.embed_dim: 1024
  - model.depth: 16
  - postprocess.train:
      align:
        to_first_cam:
          enabled: true
          points: true
        center_world:
          enabled: &pts_center_world false
          align_pose: true
        pred_center:
          enabled: false
          pr_to_gt: &pts_align_to_center false
          align_pose: true
        pts_align_to_gt:
          enabled: &pts_align_to_gt false
          conf_percentage: 80
          with_scale: true
          align_pose: true
          normalize_depth: false
          normalize_pose: false
        gt_align_to_pts:
          enabled: &gt_align_to_pts false
          conf_percentage: 80
          align_pose: true
      normalize:
        gt_pts: true
        pr_pts:
          enabled: false
          metric: False
        gt_depth:
          enabled: false
          mode: mean
        pose_translation:
          gt_enabled: false
          pred_enabled: false
          eps: 1.0e-6
        gt_pts_invariant:
          enabled: false
          translate: true
        pr_pts_invariant:
          enabled: false
          translate: false
  - loss.switch:
          aligned_world_points: false
  # - data.data_module.train_config.num_workers: 4
  # - data.data_module.train_config.resolution: "[(160,128),(224, 224),(240, 224),(240, 240)]"
  - lr: 1.0e-4
  - mode: train
  - resume_bs: true
  - total_run_time_hr: 11.6
#   - logging.log_freq: 100
#   - break_at: 20

is_private: false
enable_gpu: true
enable_tpu: false
enable_internet: true
resume_full_ckpt: false
resume_source: kernel #dataset/kernel
resume_infer: false

# Optional: exact dataset/kernel dependencies for Kaggle metadata
dataset_sources: 
kernel_sources: 
competition_sources: []
model_sources: []
