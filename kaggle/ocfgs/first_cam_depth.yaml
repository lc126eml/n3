id: 
config_name: default_kaggle_vggt_pretrained
n3_github_zip_url: https://github.com/lc126eml/n3/archive/refs/heads/omega.zip
desc: first_cam_depth
desc_keys: ["seed","model.loop", "data.pose_convention", "model.rope_freq", "model.grad_start_layer"]
memo: 
memo_keys: ["seed","model.loop", "model.simple_camera", "data.pose_convention", "optim.warmup_epochs", "model.rope_freq", "model.grad_start_layer", "postprocess.val.metrics.recon.from_cam_err", "data.data_module.train_config.batch_size"]
run_id: 0
total_runs: 10
seed: 42
end_time: 22.0
simple:
  - total_run_time_hr: 11.
  - max_epochs: 130
  - break_at: 130
  - accum_steps: 4
  - checkpoint.resume_config_skip_keys: [total_run_time_hr]
  - model.patch_embed: null
  - model.enable_depth: true
  - model.loop: false
  - model.simple_camera: false
  - model.rope_freq: -1
  - model.depth: 12
  - model.grad_start_layer: 0
  - data.pose_convention: c2w
  - data.data_module.train_config.batch_size: 20
  - data.data_module.train_config.augs.max_scale: 1.2
  - data.data_module.train_config.augs.random_crop_prob: 0.0
  - data.data_module.train_config.augs.pcrop: 0.0
  - data.data_module.train_config.resolution_cost_power: 1.13
  - data.data_module.train_config.debug_enumerate_batches: false
  - optim.warmup_epochs: -1
  - optim.warmup_batch_cost_discount: 0.55
  # - optim.gradient_clip.configs.0.max_norm: 1.0
  # - optim.gradient_clip.configs.1.max_norm: 5.0
  # - optim.gradient_clip.configs.2.max_norm: 5.0
  # - optim.gradient_clip.configs.3.max_norm: 5.0
  # - optim.gradient_clip.configs.4.max_norm: 5.0
  - optim.val_freq: 1
  # - optim.frozen_module_names: null
  # - optim.lr_multipliers.0.ratio: 0.01
  # - optim.lr_multipliers.1.ratio: 0.01
  # - optim.lr_multipliers.2.ratio: 1.0
  # - optim.lr_multipliers.2.ratio: 0.1
  # - optim.lr_multipliers.3.ratio: 0.1
  - logging.scalar_keys_to_log:
      train:
        mode: auto
        keys_to_log: []
      val:
        mode: auto
        keys_to_log: []

  - postprocess.val:
      transform:
        cam_from_depth: false
        global_from_cam: false
        global_from_cam_detach_pose: false
        global_from_depth: true
      metrics:
        camera:
          enabled: true
          abs_err: true
          rel_err: true
          auc: true
          # abs_err_angle: True
          # rel_err_angle: True
          # all_pairs_err: True
        depth:
          enabled: true
          align: median
          sq_rel: false
          rmse: false
          log_rmse: false
          delta: false
        intrinsics:
          enabled: true
        recon:
          pts_err: True
          nn_metrics: true
          nn_threshold: 0.05
          nn_max_points: 200000
          from_cam_err: false
          from_depth_err: true

  - postprocess.train:
      align:
        to_first_cam:
          enabled: true
          points: true
        pr_align_cam:
          enabled: false
          points: false
        center_world:
          enabled: &pts_center_world false
          align_pose: true
        pred_center:
          enabled: false
          pr_to_gt: &pts_align_to_center false
          align_pose: true
        pts_align_to_gt:
          enabled: &pts_align_to_gt false
          conf_percentage: 80
          with_scale: true
          align_pose: true
          normalize_depth: false
          normalize_pose: false
        gt_align_to_pts:
          enabled: &gt_align_to_pts false
          conf_percentage: 80
          align_pose: true
        depth_align_to_gt:
          enabled: false
          conf_percentage: 80
          pose: true
      normalize:
        gt_pts: true
        pr_pts:
          enabled: false
          metric: False
        gt_depth:
          enabled: false
          mode: mean
        pose_translation:
          gt_enabled: false
          pred_enabled: false
          eps: 1.0e-6
        gt_pts_invariant:
          enabled: false
          translate: true
        pr_pts_invariant:
          enabled: false
          translate: false
          min_scale: 0.5
          max_scale: 3.0
          min_valid_points: 3
      transform:
        cam_from_depth: false
        global_from_cam: false
        global_from_cam_detach_pose: false
        global_from_depth: false
  - loss.switch:
          aligned_world_points: false
  # - data.data_module.train_config.num_workers: 4
  # - data.data_module.train_config.resolution: "[(160,128),(224, 224),(240, 224),(240, 240)]"
  - lr: 1.0e-4
  - mode: train
  - resume_bs: true
#   - logging.log_freq: 100
#   - break_at: 20

is_private: false
enable_gpu: true
enable_tpu: false
enable_internet: true
resume_full_ckpt: false
resume_source: null #dataset/kernel
resume_infer: false
resume_checkpoint_path: /kaggle/input/datasets/sinayliu/vomega-ds/vggt_omega_1b_512.pt

# Optional: exact dataset/kernel dependencies for Kaggle metadata
dataset_sources: 
kernel_sources: 
competition_sources: []
model_sources: []
